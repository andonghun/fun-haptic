<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play — Pixel Haptics</title>
<meta name="description" content="Play with DualSense HD haptics and adaptive triggers in your browser. Works with any gamepad, or keyboard and mouse.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<!-- AdSense: site-wide script goes here once approved. Ads appear on the menu only, never during play. -->
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-arrow-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></symbol>
  <symbol id="i-gamepad" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" x2="10" y1="11" y2="11"/><line x1="8" x2="8" y1="9" y2="13"/><line x1="15" x2="15.01" y1="12" y2="12"/><line x1="18" x2="18.01" y1="10" y2="10"/><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"/></symbol>
  <symbol id="i-vibrate" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 8 2 2-2 2 2 2-2 2"/><path d="m22 8-2 2 2 2-2 2 2 2"/><rect width="8" height="14" x="8" y="5" rx="1"/></symbol>
  <symbol id="i-keyboard" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="M6 8h.01"/><path d="M10 8h.01"/><path d="M14 8h.01"/><path d="M18 8h.01"/><path d="M8 12h.01"/><path d="M12 12h.01"/><path d="M16 12h.01"/><path d="M7 16h10"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></symbol>
</svg>

<canvas id="px"></canvas>

<section id="boot" class="screen on"><div class="dim" data-t="loading"></div></section>

<section id="title" class="screen">
  <header class="topbar">
    <a class="brand" href="../index.html"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span data-t="title"></span></a>
    <div class="devbar">
      <span class="dev" id="stPad"></span>
      <span class="dev" id="stHD"></span>
      <button class="btn small primary" id="bConnect"></button>
      <button class="btn small" id="bHD"></button>
      <button class="btn small" id="bTest"></button>
      <button class="btn small ghost" id="bSetup"><svg class="i"><use href="#i-settings"/></svg></button>
      <button class="btn small ghost" id="bLang" data-t="language"></button>
    </div>
  </header>
  <div class="menu-wrap">
    <p class="eyebrow" data-t="pick"></p>
    <h1 class="h1" id="menuH"></h1>
    <div class="xp-grid" id="xpGrid"></div>
    <p class="controls-note" id="ctlNote"></p>
    <!-- Ad slot: menu only, never during play -->
    <div class="ad-slot" id="adTitle"></div>
  </div>
</section>

<section id="onboard" class="screen">
  <div class="card">
    <h2 data-t="ob_title"></h2>
    <div class="steps">
      <div class="step" id="obS1"><h3><span data-t="ob_step1"></span><span class="badge" id="obB1"></span></h3>
        <div class="row" style="margin-top:10px"><button class="btn primary small" id="obConnect" data-t="ob_ds"></button><button class="btn small" id="obOther" data-t="ob_other"></button></div>
        <div class="msg" id="obM1"></div></div>
      <div class="step" id="obS2"><h3><span data-t="ob_step2"></span><span class="badge" id="obB2"></span></h3>
        <div class="msg" data-t="ob_hd_why"></div>
        <div class="row" style="margin-top:10px"><button class="btn primary small" id="obHD" data-t="ob_hd_btn"></button><button class="btn small" id="obSkip" data-t="ob_hd_skip"></button></div>
        <div class="msg" id="obM2"></div></div>
      <div class="step" id="obS3"><h3><span data-t="ob_step3"></span><span class="badge" id="obB3"></span></h3>
        <div class="row" style="margin-top:10px"><button class="btn small" id="obTest" data-t="ob_test"></button><button class="btn small" id="obYes" data-t="ob_yes"></button><button class="btn small" id="obNo" data-t="ob_no"></button></div>
        <div class="msg" id="obM3"></div></div>
    </div>
    <button class="btn primary" id="obGo" data-t="ob_go" style="margin-top:18px"></button>
  </div>
</section>

<section id="pause" class="screen">
  <div class="card" style="max-width:440px">
    <h2 data-t="pause"></h2>
    <p class="dim" id="pDev"></p>
    <button class="btn primary" id="pResume" data-t="resume"></button>
    <div class="set">
      <span data-t="haptic_level"></span><input type="range" id="pHap" min="0" max="1.6" step="0.1">
      <span data-t="volume"></span><input type="range" id="pVol" min="0" max="1" step="0.05">
    </div>
    <button class="btn" id="pTest" data-t="hap_test"></button>
    <button class="btn" id="pOut"></button>
    <button class="btn" id="pLang" data-t="language"></button>
    <button class="btn" id="pHub" data-t="to_menu"></button>
  </div>
</section>

<div id="hud">
  <div class="hud-tl"><b id="hTitle"></b><div id="hSub" class="dim"></div></div>
  <div class="hud-tr"><span class="dev small" id="hDev"></span><div id="hRight"></div></div>
  <button class="hud-menu" id="hMenu" aria-label="Menu"><svg class="i"><use href="#i-arrow-left"/></svg></button>
  <div class="hud-prompt" id="hPrompt"></div>
  <div class="hud-zone" id="hZone"></div>
  <div class="hud-ctl" id="hCtl"></div>
</div>
<div id="toast"></div>
<div id="fade"></div>
<div class="foot" id="foot"><span data-t="footer_credits"></span> · <a href="../index.html">Pixel Haptics</a></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
